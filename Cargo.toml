[package]
name = "bevy_vr_starter"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.7"
# `bevy_dev_tools` is not a default feature; it provides the frame-time
# overlay bound to F3. Drop it for a shipping build if you do not want the
# dev tooling compiled in.
bevy = { version = "0.19", features = ["bevy_dev_tools"] }
# OpenXR backend for bevy_mod_xr. These three move in lockstep with Bevy's
# minor version — bump them together or the dependency graph will not resolve.
bevy_mod_openxr = "0.6"
bevy_mod_xr = "0.6"
# Needed directly because action sets, paths and haptics are raw OpenXR types.
openxr = "0.21.1"

# Compile our own code with light optimization and dependencies with full
# optimization. Dependencies are built once; our crate is rebuilt constantly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# Debug info for dependencies costs a lot of memory at codegen time and buys
# nothing when you are debugging your own code.
debug = false
